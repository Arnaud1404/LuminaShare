name: Java CI with Maven

on:
  push:
    branches: [ "develop", "github_arnaud", "main", "master" ]
  pull_request:
    branches: [ "develop", "github_arnaud", "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_PATH: "pgsql"
      DATABASE_NAME: "argomes"
      DATABASE_TABLE: "GitCI"
      DATABASE_RESET: "true"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: mvn --batch-mode compile

    - name: Test with Maven
      run: mvn --batch-mode test
