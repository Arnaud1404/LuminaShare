name: Java CI with Maven

on:
  push:
    branches: [ "develop", "github_arnaud", "main", "master" ]
  pull_request:
    branches: [ "develop", "github_arnaud", "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_PATH: "pgsql"
      DATABASE_NAME: "argomes"
      DATABASE_TABLE: "GitCI"
      DATABASE_RESET: "true"

    steps:
    - uses: actions/checkout@v4

    - name: Start PostgreSQL container
      run: |
        docker run -d \
          --name postgres-db \
          -e POSTGRES_USER=imagedb \
          -e POSTGRES_PASSWORD=password \
          -e POSTGRES_DB=imagedb \
          -p 5432:5432 \
          pgvector/pgvector:pg16
        
        # Wait for PostgreSQL to be ready
        until docker exec postgres-db pg_isready -U imagedb; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: cd backend && ./mvnw --batch-mode compile

    - name: Test with Maven
      run: cd backend && ./mvnw --batch-mode test
